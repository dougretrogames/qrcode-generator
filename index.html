<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#6D5DFC">
<title>Gerador de QR Code</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root {
  --primary: #6D5DFC;
  --primary-dark: #5748e8;
  --background: #f4f5fb;
  --card: #ffffff;
  --text: #171827;
  --muted: #777b8c;
  --border: #e3e5ed;
  --radius-lg: 20px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --background: #12131c;
    --card: #1b1c29;
    --text: #f2f2f7;
    --muted: #9498a8;
    --border: #2c2e40;
  }
  input, select, textarea, .frame-button, .social-button {
    background: #22233350 !important;
    color: var(--text);
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

body {
  min-height: 100vh;
  padding: max(20px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 10% 0%, #6d5dfc22, transparent 32%),
    radial-gradient(circle at 100% 100%, #6d5dfc18, transparent 30%),
    var(--background);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--text);
  transition: background .3s, color .3s;
}

.app {
  width: min(100%, 700px);
  margin: auto;
  padding: 28px;
  background: var(--card);
  border-radius: var(--radius-lg);
  box-shadow: 0 18px 55px rgba(28, 30, 52, 0.10);
}

.header { text-align: center; margin-bottom: 25px; }

.logo {
  width: 54px; height: 54px; margin: 0 auto 14px;
  display: grid; place-items: center; border-radius: 16px;
  background: linear-gradient(135deg, #6D5DFC, #897DFF);
  box-shadow: 0 10px 25px #6D5DFC40;
}
.logo::before { content: ""; width: 22px; height: 22px; border: 4px solid white; border-radius: 4px; }

h1 { font-size: clamp(1.4rem, 5vw, 1.7rem); letter-spacing: -0.03em; }
.subtitle { margin-top: 7px; color: var(--muted); font-size: 0.94rem; }

.label { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: 0.88rem; font-weight: 700; }
.counter { color: var(--muted); font-weight: 500; }

.input-wrapper { position: relative; }

textarea {
  display: block; width: 100%; min-height: 105px; resize: vertical;
  padding: 14px 45px 14px 15px; border: 1px solid var(--border); border-radius: 13px;
  background: #fafbfe; color: var(--text); font: inherit; font-size: 16px; line-height: 1.45; outline: none;
  transition: border-color .2s, box-shadow .2s;
}

textarea:focus, input:focus, select:focus {
  border-color: var(--primary); box-shadow: 0 0 0 4px #6D5DFC18; background: white;
}
@media (prefers-color-scheme: dark) {
  textarea:focus, input:focus, select:focus { background: #22233370; }
}

.clear-button {
  position: absolute; top: 9px; right: 9px; width: 34px; height: 34px;
  border: none; border-radius: 8px; background: transparent; color: #9296a5;
  cursor: pointer; font-size: 22px; display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.clear-button:hover, .clear-button:active { background: #00000010; }

.customization { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--border); }
.section-title { margin-bottom: 14px; font-weight: 800; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.field { margin-bottom: 14px; }
.field-label { display: block; margin-bottom: 7px; font-size: 0.81rem; font-weight: 700; }

input, select {
  width: 100%; height: 44px; padding: 0 11px; border: 1px solid var(--border);
  border-radius: 10px; background: #fafbfe; color: var(--text); font: inherit; font-size: 16px; outline: none;
}

.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch {
  width: 36px; height: 36px; border: 2px solid white; outline: 1px solid #d9dbe4;
  border-radius: 50%; cursor: pointer; transition: transform .15s;
}
.swatch:active { transform: scale(0.9); }
.swatch.active { outline: 2px solid var(--primary); outline-offset: 2px; }

.hex-row { display: flex; gap: 8px; }
.color-picker { width: 48px; height: 44px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: white; cursor: pointer; }
.hex-input { flex: 1; text-transform: uppercase; }

.frames { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; }
.frame-button {
  min-height: 52px; border: 1px solid var(--border); border-radius: 10px; background: #fafbfe;
  color: var(--muted); font: inherit; font-size: 0.76rem; font-weight: 650; cursor: pointer;
  transition: transform .1s, border-color .15s;
}
.frame-button:active { transform: scale(0.96); }
.frame-button.active { border-color: var(--primary); color: var(--primary); background: #6D5DFC0D; box-shadow: inset 0 0 0 1px var(--primary); }

.checkbox-field label { display: flex; align-items: center; gap: 9px; cursor: pointer; font-size: 0.86rem; font-weight: 650; }
.checkbox-field input[type="checkbox"] { width: 19px; height: 19px; accent-color: var(--primary); cursor: pointer; }

.social-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.social-button {
  min-height: 58px; border: 1px solid var(--border); border-radius: 10px; background: #fafbfe;
  color: var(--muted); font: inherit; font-size: 0.72rem; cursor: pointer; transition: transform .1s, border-color .15s;
}
.social-button:active { transform: scale(0.96); }
.social-button.active { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.social-button svg { display: block; width: 22px; height: 22px; margin: 0 auto 4px; }

.frame-options { display: none; margin-top: 5px; }
.icon-options { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--border); }

.ecc-notice {
  display: none; margin-top: 10px; padding: 9px 12px; border-radius: 9px;
  background: #6D5DFC12; color: var(--primary); font-size: 0.78rem; font-weight: 650;
}
.ecc-notice.visible { display: block; }

.actions { display: flex; gap: 10px; margin-top: 18px; position: sticky; bottom: max(10px, env(safe-area-inset-bottom)); }
.action-button {
  flex: 1; min-height: 50px; border: none; border-radius: 12px; font: inherit; font-weight: 750; cursor: pointer;
  transition: transform .12s, opacity .2s; -webkit-tap-highlight-color: transparent;
}
.action-button:active { transform: scale(0.97); }

.generate-button { color: white; background: linear-gradient(135deg, #6D5DFC, #7B6CFF); box-shadow: 0 8px 18px #6D5DFC38; }
.download-button { display: none; color: white; background: #171827; }

.preview { display: none; margin-top: 23px; padding-top: 23px; border-top: 1px solid var(--border); text-align: center; }
.preview.visible { display: block; animation: fadeIn .35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.preview-container { overflow: auto; padding: 5px; }
#qr-canvas { display: block; width: auto; max-width: 100%; height: auto; margin: auto; border-radius: 8px; box-shadow: 0 10px 28px rgba(28, 30, 52, 0.12); }
.preview-info { margin-top: 11px; color: var(--muted); font-size: 0.8rem; }

.footer { margin-top: 20px; text-align: center; color: #9a9daa; font-size: 0.75rem; }

@media (max-width: 600px) {
  .app { padding: 20px 16px; border-radius: 18px; }
  .grid { grid-template-columns: 1fr; }
  .social-grid { grid-template-columns: repeat(2, 1fr); }
  .actions { flex-direction: column; position: static; }
}

@media (min-width: 900px) {
  body { display: flex; align-items: center; }
}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div class="logo"></div>
    <h1>Gerador de QR Code</h1>
    <p class="subtitle">Crie, personalize e baixe seu QR Code em PNG — com pré-visualização em tempo real.</p>
  </header>

  <div class="label">
    <label for="qr-text">Texto ou link</label>
    <span id="counter" class="counter">0 caracteres</span>
  </div>

  <div class="input-wrapper">
    <textarea id="qr-text" maxlength="2000" placeholder="Cole um link ou digite qualquer texto..." spellcheck="false"></textarea>
    <button id="clear-button" class="clear-button" type="button" aria-label="Limpar">×</button>
  </div>

  <section class="customization">
    <div class="section-title">Personalização</div>

    <div class="grid">
      <div class="field">
        <label class="field-label">Formato dos pixels</label>
        <select id="module-style" aria-label="Formato dos pixels">
          <option value="square">Quadrado</option>
          <option value="rounded">Arredondado</option>
          <option value="dot">Pontos</option>
          <option value="soft">Arredondado suave</option>
          <option value="circle">Círculo</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">Correção de erro</label>
        <select id="error-level" aria-label="Correção de erro">
          <option value="H">Alta — H</option>
          <option value="Q">Boa — Q</option>
          <option value="M">Média — M</option>
          <option value="L">Baixa — L</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label class="field-label">Cores predefinidas</label>
      <div class="swatches" role="group" aria-label="Cores predefinidas">
        <button class="swatch active" data-color="#000000" style="background:#000000" aria-label="Preto"></button>
        <button class="swatch" data-color="#1F2937" style="background:#1F2937" aria-label="Cinza escuro"></button>
        <button class="swatch" data-color="#2563EB" style="background:#2563EB" aria-label="Azul"></button>
        <button class="swatch" data-color="#6D5DFC" style="background:#6D5DFC" aria-label="Roxo"></button>
        <button class="swatch" data-color="#7C3AED" style="background:#7C3AED" aria-label="Violeta"></button>
        <button class="swatch" data-color="#DB2777" style="background:#DB2777" aria-label="Rosa"></button>
        <button class="swatch" data-color="#DC2626" style="background:#DC2626" aria-label="Vermelho"></button>
        <button class="swatch" data-color="#EA580C" style="background:#EA580C" aria-label="Laranja"></button>
        <button class="swatch" data-color="#16A34A" style="background:#16A34A" aria-label="Verde"></button>
        <button class="swatch" data-color="#0891B2" style="background:#0891B2" aria-label="Ciano"></button>
      </div>
    </div>

    <div class="grid">
      <div class="field">
        <label class="field-label">Cor do QR — HEX</label>
        <div class="hex-row">
          <input id="qr-color-picker" class="color-picker" type="color" value="#000000" aria-label="Seletor de cor do QR">
          <input id="qr-color" class="hex-input" type="text" value="#000000" maxlength="7" inputmode="text">
        </div>
      </div>
      <div class="field">
        <label class="field-label">Cor do fundo — HEX</label>
        <div class="hex-row">
          <input id="bg-color-picker" class="color-picker" type="color" value="#FFFFFF" aria-label="Seletor de cor do fundo">
          <input id="bg-color" class="hex-input" type="text" value="#FFFFFF" maxlength="7" inputmode="text">
        </div>
      </div>
    </div>

    <div class="field">
      <label class="field-label">Posição do frame</label>
      <div class="frames">
        <button class="frame-button active" data-frame="none">Nenhum</button>
        <button class="frame-button" data-frame="top">Superior</button>
        <button class="frame-button" data-frame="bottom">Inferior</button>
        <button class="frame-button" data-frame="left">Lateral esq.</button>
        <button class="frame-button" data-frame="right">Lateral dir.</button>
        <button class="frame-button" data-frame="full">Completo</button>
      </div>
    </div>

    <div id="frame-options" class="frame-options">
      <div class="grid">
        <div class="field">
          <label class="field-label">Texto do frame</label>
          <input id="frame-text" type="text" value="Acesse aqui" maxlength="70">
        </div>
        <div class="field">
          <label class="field-label">Cor do frame</label>
          <div class="hex-row">
            <input id="frame-color-picker" class="color-picker" type="color" value="#6D5DFC" aria-label="Seletor de cor do frame">
            <input id="frame-color" class="hex-input" type="text" value="#6D5DFC" maxlength="7">
          </div>
        </div>
      </div>

      <div class="field checkbox-field">
        <label>
          <input type="checkbox" id="frame-rounded">
          Cantos arredondados
        </label>
      </div>
    </div>

    <div class="icon-options">
      <div class="field checkbox-field">
        <label>
          <input type="checkbox" id="icon-enabled">
          Adicionar ícone social sobre o QR Code
        </label>
      </div>

      <div id="ecc-notice" class="ecc-notice">
        Correção de erro elevada para H automaticamente para garantir a leitura com o logo.
      </div>

      <div id="social-options" style="display:none">
        <div class="field">
          <label class="field-label">Rede social</label>
          <div class="social-grid" id="social-grid"></div>
        </div>
      </div>
    </div>
  </section>

  <div class="actions">
    <button id="generate-button" class="action-button generate-button">Gerar QR Code</button>
    <button id="download-button" class="action-button download-button">Baixar PNG</button>
  </div>

  <section id="preview" class="preview">
    <div class="preview-container"><canvas id="qr-canvas"></canvas></div>
    <p id="preview-info" class="preview-info"></p>
  </section>

  <footer class="footer">Tudo é processado localmente no navegador. Ícones oficiais via Simple Icons (CC0).</footer>
</main>

const SOCIAL_LABELS = { whatsapp: "WhatsApp", instagram: "Instagram", youtube: "YouTube", facebook: "Facebook", x: "X", linkedin: "LinkedIn", telegram: "Telegram", tiktok: "TikTok", discord: "Discord" };

function buildSocialGrid() {
  const grid = document.getElementById("social-grid");
  const gradDefs = `<defs><linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FEDA75"/><stop offset="30%" stop-color="#FA7E1E"/>
    <stop offset="55%" stop-color="#D62976"/><stop offset="80%" stop-color="#962FBF"/>
    <stop offset="100%" stop-color="#4F5BD5"/></linearGradient></defs>`;
  Object.keys(SOCIAL_ICONS).forEach(key => {
    const icon = SOCIAL_ICONS[key];
    const button = document.createElement("button");
    button.className = "social-button";
    button.dataset.social = key;
    let inner = `<svg viewBox="${icon.viewBox}">${gradDefs}<path fill="${icon.color}" d="${icon.path}"/>`;
    if (icon.overlay) inner += `<path fill="${icon.overlay.fill}" d="${icon.overlay.path}"/>`;
    inner += `</svg>${SOCIAL_LABELS[key]}`;
    button.innerHTML = inner;
    button.addEventListener("click", function () {
      document.querySelectorAll(".social-button").forEach(item => item.classList.remove("active"));
      this.classList.add("active");
      currentSocial = key;
      schedulePreview();
    });
    grid.appendChild(button);
  });
}
buildSocialGrid();

function isValidHex(value) { return /^#[0-9A-Fa-f]{6}$/.test(value); }

function updateCounter() {
  const length = input.value.length;
  document.getElementById("counter").textContent = `${length} ${length === 1 ? "caractere" : "caracteres"}`;
}

function generateBaseQR() {
  const text = input.value.trim();
  const errorLevel = document.getElementById("error-level").value;
  const style = document.getElementById("module-style").value;
  const qr = qrcode(0, errorLevel);
  qr.addData(text);
  qr.make();
  const modules = qr.getModuleCount();
  const usableSize = QR_SIZE - (QR_MARGIN * 2);
  const moduleSize = usableSize / modules;
  const qrCanvas = document.createElement("canvas");
  qrCanvas.width = QR_SIZE;
  qrCanvas.height = QR_SIZE;
  const qrCtx = qrCanvas.getContext("2d");
  qrCtx.fillStyle = backgroundColor;
  qrCtx.fillRect(0, 0, QR_SIZE, QR_SIZE);
  qrCtx.fillStyle = qrColor;

  const finderZones = [
    { r0: 0, c0: 0 },
    { r0: 0, c0: modules - 7 },
    { r0: modules - 7, c0: 0 }
  ];
  const inFinderZone = (row, col) => finderZones.some(z => row >= z.r0 && row < z.r0 + 7 && col >= z.c0 && col < z.c0 + 7);

  for (let row = 0; row < modules; row++) {
    for (let col = 0; col < modules; col++) {
      if (!qr.isDark(row, col)) continue;
      if (inFinderZone(row, col)) continue;
      const x = QR_MARGIN + col * moduleSize;
      const y = QR_MARGIN + row * moduleSize;
      drawModule(qrCtx, x, y, moduleSize, style);
    }
  }

  finderZones.forEach(zone => {
    const x = QR_MARGIN + zone.c0 * moduleSize;
    const y = QR_MARGIN + zone.r0 * moduleSize;
    drawFinderPattern(qrCtx, x, y, moduleSize, style, qrColor, backgroundColor);
  });

  return qrCanvas;
}

function drawModule(context, x, y, size, style) {
  if (style === "square") {
    context.fillRect(Math.round(x), Math.round(y), Math.ceil(size), Math.ceil(size));
    return;
  }
  if (style === "dot" || style === "circle") {
    context.beginPath();
    context.arc(x + size / 2, y + size / 2, size * 0.43, 0, Math.PI * 2);
    context.fill();
    return;
  }
  let radius = style === "soft" ? size * 0.30 : size * 0.50;
  roundedRect(context, x + 0.15, y + 0.15, size - 0.3, size - 0.3, radius);
  context.fill();
}

function drawFinderPattern(context, x, y, moduleSize, style, color, bgColor) {
  const outer = moduleSize * 7;
  const middle = moduleSize * 5;
  const inner = moduleSize * 3;
  const midOffset = moduleSize;
  const innerOffset = moduleSize * 2;

  if (style === "circle") {
    context.fillStyle = color;
    context.beginPath();
    context.arc(x + outer / 2, y + outer / 2, outer / 2, 0, Math.PI * 2);
    context.fill();

    context.fillStyle = bgColor;
    context.beginPath();
    context.arc(x + outer / 2, y + outer / 2, middle / 2, 0, Math.PI * 2);
    context.fill();

    context.fillStyle = color;
    context.beginPath();
    context.arc(x + outer / 2, y + outer / 2, inner / 2, 0, Math.PI * 2);
    context.fill();
    return;
  }

  let outerRadius = 0, innerRadius = 0;
  if (style === "dot") { outerRadius = outer * 0.28; innerRadius = inner * 0.42; }
  else if (style === "rounded") { outerRadius = outer * 0.30; innerRadius = inner * 0.45; }
  else if (style === "soft") { outerRadius = outer * 0.16; innerRadius = inner * 0.22; }

  context.fillStyle = color;
  roundedRect(context, x, y, outer, outer, outerRadius);
  context.fill();

  context.fillStyle = bgColor;
  roundedRect(context, x + midOffset, y + midOffset, middle, middle, Math.max(0, outerRadius - moduleSize));
  context.fill();

  context.fillStyle = color;
  roundedRect(context, x + innerOffset, y + innerOffset, inner, inner, innerRadius);
  context.fill();
}

function roundedRect(context, x, y, width, height, radius) {
  radius = Math.min(radius, width / 2, height / 2);
  context.beginPath();
  context.moveTo(x + radius, y);
  context.lineTo(x + width - radius, y);
  context.quadraticCurveTo(x + width, y, x + width, y + radius);
  context.lineTo(x + width, y + height - radius);
  context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  context.lineTo(x + radius, y + height);
  context.quadraticCurveTo(x, y + height, x, y + height - radius);
  context.lineTo(x, y + radius);
  context.quadraticCurveTo(x, y, x + radius, y);
  context.closePath();
}

function fitText(context, text, maxWidth, initialSize) {
  let size = initialSize;
  context.font = `700 ${size}px Arial`;
  while (context.measureText(text).width > maxWidth && size > 10) {
    size--;
    context.font = `700 ${size}px Arial`;
  }
  return size;
}

function isRounded() { return document.getElementById("frame-rounded").checked; }

function computeLayout(position) {
  switch (position) {
    case "top":
      return { width: QR_SIZE, height: QR_SIZE + GAP + BAR_THICK, qrX: 0, qrY: BAR_THICK + GAP,
        bar: { x: 0, y: 0, w: QR_SIZE, h: BAR_THICK }, orientation: "h" };
    case "bottom":
      return { width: QR_SIZE, height: QR_SIZE + GAP + BAR_THICK, qrX: 0, qrY: 0,
        bar: { x: 0, y: QR_SIZE + GAP, w: QR_SIZE, h: BAR_THICK }, orientation: "h" };
    case "left":
      return { width: QR_SIZE + GAP + BAR_THICK, height: QR_SIZE, qrX: BAR_THICK + GAP, qrY: 0,
        bar: { x: 0, y: 0, w: BAR_THICK, h: QR_SIZE }, orientation: "v", rotate: -1 };
    case "right":
      return { width: QR_SIZE + GAP + BAR_THICK, height: QR_SIZE, qrX: 0, qrY: 0,
        bar: { x: QR_SIZE + GAP, y: 0, w: BAR_THICK, h: QR_SIZE }, orientation: "v", rotate: 1 };
    case "full":
      return { width: QR_SIZE + RING_THICK * 2, height: RING_THICK + QR_SIZE + BOTTOM_TEXT_H,
        qrX: RING_THICK, qrY: RING_THICK, full: true };
    default:
      return { width: QR_SIZE, height: QR_SIZE, qrX: 0, qrY: 0 };
  }
}

function drawIconOverlay(qrCtx) {
  if (!iconEnabled || !currentSocial) return Promise.resolve();
  const icon = SOCIAL_ICONS[currentSocial];
  const gradDefs = `<defs><linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FEDA75"/><stop offset="30%" stop-color="#FA7E1E"/>
    <stop offset="55%" stop-color="#D62976"/><stop offset="80%" stop-color="#962FBF"/>
    <stop offset="100%" stop-color="#4F5BD5"/></linearGradient></defs>`;
  let paths = `<path fill="${icon.color}" d="${icon.path}"/>`;
  if (icon.overlay) paths += `<path fill="${icon.overlay.fill}" d="${icon.overlay.path}"/>`;
  const svgMarkup = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${icon.viewBox}">${gradDefs}${paths}</svg>`;
  const blob = new Blob([svgMarkup], { type: "image/svg+xml" });
  const url = URL.createObjectURL(blob);
  const image = new Image();
  return new Promise(resolve => {
    image.onload = function () {
      const badgeSize = QR_SIZE * 0.20;
      const cx = QR_SIZE / 2, cy = QR_SIZE / 2;
      qrCtx.save();
      qrCtx.fillStyle = "#FFFFFF";
      roundedRect(qrCtx, cx - badgeSize / 2 - 6, cy - badgeSize / 2 - 6, badgeSize + 12, badgeSize + 12, 14);
      qrCtx.fill();
      qrCtx.drawImage(image, cx - badgeSize / 2, cy - badgeSize / 2, badgeSize, badgeSize);
      qrCtx.restore();
      URL.revokeObjectURL(url);
      resolve();
    };
    image.src = url;
  });
}

async function render() {
  const text = input.value.trim();
  if (!text) return;

  const layout = computeLayout(currentFrame);
  const qrCanvas = generateBaseQR();
  const qrCtx2 = qrCanvas.getContext("2d");
  await drawIconOverlay(qrCtx2);

  const rounded = isRounded();

  canvas.width = layout.width;
  canvas.height = layout.height;

  const frameColor = isValidHex(document.getElementById("frame-color").value)
    ? document.getElementById("frame-color").value.toUpperCase() : "#6D5DFC";
  const frameText = document.getElementById("frame-text").value.trim() || "Acesse aqui";

  if (currentFrame === "none") {
    ctx.fillStyle = backgroundColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(qrCanvas, 0, 0, QR_SIZE, QR_SIZE);
    document.getElementById("preview-info").textContent = "PNG • 500 × 500 px • margem branca de 15 px";
    return;
  }

  if (currentFrame === "full") {
    ctx.fillStyle = frameColor;
    if (rounded) {
      roundedRect(ctx, 0, 0, canvas.width, canvas.height, 26);
      ctx.fill();
    } else {
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.drawImage(qrCanvas, layout.qrX, layout.qrY, QR_SIZE, QR_SIZE);
    ctx.fillStyle = "#FFFFFF";
    ctx.textBaseline = "middle";
    ctx.textAlign = "center";
    const centerX = canvas.width / 2;
    const centerY = layout.qrY + QR_SIZE + BOTTOM_TEXT_H / 2;
    const fontSize = fitText(ctx, frameText, canvas.width - 50, 21);
    ctx.font = `700 ${fontSize}px Arial`;
    ctx.fillText(frameText, centerX, centerY);
    document.getElementById("preview-info").textContent =
      `PNG • ${canvas.width} × ${canvas.height} px • borda completa`;
    return;
  }

  ctx.fillStyle = backgroundColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(qrCanvas, layout.qrX, layout.qrY, QR_SIZE, QR_SIZE);

  const bar = layout.bar;
  ctx.fillStyle = frameColor;
  if (rounded) {
    roundedRect(ctx, bar.x, bar.y, bar.w, bar.h, 16);
    ctx.fill();
  } else {
    ctx.fillRect(bar.x, bar.y, bar.w, bar.h);
  }

  ctx.fillStyle = "#FFFFFF";
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";

  if (layout.orientation === "v") {
    ctx.save();
    ctx.translate(bar.x + bar.w / 2, bar.y + bar.h / 2);
    ctx.rotate((Math.PI / 2) * layout.rotate);
    const fontSize = fitText(ctx, frameText, bar.h - 40, 20);
    ctx.font = `700 ${fontSize}px Arial`;
    ctx.fillText(frameText, 0, 0);
    ctx.restore();
  } else {
    const fontSize = fitText(ctx, frameText, bar.w - 40, 21);
    ctx.font = `700 ${fontSize}px Arial`;
    ctx.fillText(frameText, bar.x + bar.w / 2, bar.y + bar.h / 2);
  }

  document.getElementById("preview-info").textContent =
    `PNG • ${canvas.width} × ${canvas.height} px • QR 500 × 500`;
}

function generate() {
  if (!input.value.trim()) {
    input.focus();
    return;
  }
  updatePreview();
  preview.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function downloadQRCode() {
  if (!canvas.width) return;
  const link = document.createElement("a");
  link.download = `qrcode-${canvas.width}x${canvas.height}.png`;
  link.href = canvas.toDataURL("image/png");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

async function updatePreview() {
  if (input.value.trim()) {
    preview.classList.add("visible");
    downloadButton.style.display = "block";
    await render();
  } else {
    preview.classList.remove("visible");
    downloadButton.style.display = "none";
  }
}

function schedulePreview() {
  clearTimeout(renderTimeout);
  renderTimeout = setTimeout(updatePreview, 2000);
}

input.addEventListener("input", function () {
  updateCounter();
  schedulePreview();
});

input.addEventListener("blur", function () {
  clearTimeout(renderTimeout);
  updatePreview();
});

document.getElementById("generate-button").addEventListener("click", generate);
downloadButton.addEventListener("click", downloadQRCode);

document.getElementById("clear-button").addEventListener("click", function () {
  input.value = "";
  updateCounter();
  clearTimeout(renderTimeout);
  preview.classList.remove("visible");
  downloadButton.style.display = "none";
  input.focus();
});

document.querySelectorAll(".swatch").forEach(button => {
  button.addEventListener("click", function () {
    document.querySelectorAll(".swatch").forEach(item => item.classList.remove("active"));
    this.classList.add("active");
    qrColor = this.dataset.color.toUpperCase();
    document.getElementById("qr-color").value = qrColor;
    document.getElementById("qr-color-picker").value = qrColor;
    schedulePreview();
  });
});

document.getElementById("qr-color").addEventListener("input", function () {
  if (!isValidHex(this.value)) return;
  qrColor = this.value.toUpperCase();
  document.getElementById("qr-color-picker").value = qrColor;
  schedulePreview();
});

document.getElementById("qr-color-picker").addEventListener("input", function () {
  qrColor = this.value.toUpperCase();
  document.getElementById("qr-color").value = qrColor;
  schedulePreview();
});

document.getElementById("bg-color").addEventListener("input", function () {
  if (!isValidHex(this.value)) return;
  backgroundColor = this.value.toUpperCase();
  document.getElementById("bg-color-picker").value = backgroundColor;
  schedulePreview();
});

document.getElementById("bg-color-picker").addEventListener("input", function () {
  backgroundColor = this.value.toUpperCase();
  document.getElementById("bg-color").value = backgroundColor;
  schedulePreview();
});

document.querySelectorAll(".frame-button").forEach(button => {
  button.addEventListener("click", function () {
    document.querySelectorAll(".frame-button").forEach(item => item.classList.remove("active"));
    this.classList.add("active");
    currentFrame = this.dataset.frame;
    document.getElementById("frame-options").style.display = currentFrame === "none" ? "none" : "block";
    schedulePreview();
  });
});

document.getElementById("icon-enabled").addEventListener("change", function () {
  iconEnabled = this.checked;
  document.getElementById("social-options").style.display = iconEnabled ? "block" : "none";
  document.getElementById("ecc-notice").classList.toggle("visible", iconEnabled);
  if (iconEnabled) {
    document.getElementById("error-level").value = "H";
    if (!currentSocial) {
      currentSocial = "whatsapp";
      document.querySelector('.social-button[data-social="whatsapp"]').classList.add("active");
    }
  }
  schedulePreview();
});

document.getElementById("module-style").addEventListener("change", schedulePreview);
document.getElementById("error-level").addEventListener("change", schedulePreview);
document.getElementById("frame-text").addEventListener("input", schedulePreview);
document.getElementById("frame-rounded").addEventListener("change", schedulePreview);

document.getElementById("frame-color").addEventListener("input", function () {
  if (!isValidHex(this.value)) return;
  document.getElementById("frame-color-picker").value = this.value.toUpperCase();
  schedulePreview();
});

document.getElementById("frame-color-picker").addEventListener("input", function () {
  document.getElementById("frame-color").value = this.value.toUpperCase();
  schedulePreview();
});

updateCounter();
</script>
